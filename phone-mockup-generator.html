<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Mockup Generator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #151414;
      --panel: #201f1f;
      transition: background-color .15s ease;
      --line: #3a3838;
      --text: #f5f4f2;
      --muted: #aaa6a3;
      --accent: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, select, input { font: inherit; }
    button, select { color: inherit; }

    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }

    .sidebar {
      padding: 24px;
      border-right: 1px solid var(--line);
      background: #1a1919;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -.02em;
    }

    .section { display: grid; gap: 11px; }

    .device-section { display: none; }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
    }

    select, .secondary, .segment, .upload-button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 10px;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 15px;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    select {
      width: 100%;
      appearance: none;
      padding: 11px 40px 11px 12px;
      color: var(--text);
      background-color: #2c2b2b !important;
      color-scheme: dark;
      cursor: pointer;
    }

    option {
      color: var(--text);
      background-color: #2c2b2b !important;
    }

    .swatches { display: flex; flex-wrap: wrap; gap: 9px; }

    .swatch {
      width: 34px;
      height: 34px;
      padding: 3px;
      border: 2px solid transparent;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }

    .swatch::before {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--color);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
    }

    .swatch.active { border-color: var(--accent); }

    .segment {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 3px;
    }

    .segment button {
      border: 0;
      border-radius: 7px;
      padding: 9px 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .segment button.active {
      color: var(--text);
      background: #454242;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .secondary, .upload-button {
      min-height: 42px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: center;
    }

    .secondary:hover, .upload-button:hover { border-color: #5b5858; }

    .upload-button {
      display: grid;
      place-items: center;
      width: 100%;
    }

    .upload-button input { display: none; }

    .download {
      min-height: 48px;
      margin-top: auto;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #171717;
      font-weight: 750;
      cursor: pointer;
      transition: background-color .15s ease;
    }

    .download:hover:not(:disabled) {
      background: #e1e1e1;
    }

    .download:active:not(:disabled) {
      background: #c8c8c8;
    }

    .download:disabled, .secondary:disabled {
      opacity: .38;
      cursor: not-allowed;
    }

    .hint { margin: -3px 0 0; color: var(--muted); font-size: 12px; }

    .workspace {
      min-width: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
    }

    .stage {
      position: relative;
      min-height: 560px;
      padding: 34px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background-color: #181717;
      background-image:
        linear-gradient(45deg, #1e1d1d 25%, transparent 25%),
        linear-gradient(-45deg, #1e1d1d 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1e1d1d 75%),
        linear-gradient(-45deg, transparent 75%, #1e1d1d 75%);
      background-size: 28px 28px;
      background-position: 0 0, 0 14px, 14px -14px, -14px 0;
    }

    .stage.dragover::after {
      content: "Drop image here";
      position: absolute;
      inset: 20px;
      z-index: 4;
      display: grid;
      place-items: center;
      border: 2px dashed var(--accent);
      border-radius: 18px;
      background: rgba(21,20,20,.88);
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
    }

    .canvas-wrap {
      position: relative;
      height: min(78vh, 760px);
      max-width: 100%;
      filter: drop-shadow(0 28px 42px rgba(0,0,0,.38));
    }

    canvas {
      display: block;
      height: 100%;
      max-width: 100%;
      width: auto;
      touch-action: none;
      user-select: none;
    }

    canvas.can-move { cursor: grab; }
    canvas.can-move:active { cursor: grabbing; }

    .empty {
      position: absolute;
      z-index: 3;
      display: grid;
      justify-items: center;
      gap: 8px;
      pointer-events: none;
      text-align: center;
      color: #fff;
    }

    .empty strong { font-size: 16px; }
    .empty span { color: #b8b4b1; font-size: 12px; }
    .empty.hidden { display: none; }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      padding: 11px 14px;
      border-radius: 10px;
      background: #f4f3ef;
      color: #191818;
      box-shadow: 0 16px 50px rgba(0,0,0,.35);
      transform: translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }

    .toast.show { transform: none; opacity: 1; }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .workspace { min-height: 620px; }
      .stage { min-height: 520px; padding: 24px; }
      .canvas-wrap { height: 520px; }
      .output-info { display: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Phone Mockup</h1>
      </div>

      <section class="section device-section" hidden>
        <label class="label" for="deviceSelect">Device</label>
        <div class="select-wrap">
          <select id="deviceSelect"></select>
        </div>
      </section>

      <section class="section">
        <span class="label">Frame color</span>
        <div class="swatches" id="swatches"></div>
      </section>

      <section class="section">
        <label class="upload-button">
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp">
          <span id="uploadLabel">Upload image</span>
        </label>
        <p class="hint">PNG, JPG, or WebP. You can also drag and drop a file.</p>
      </section>

      <section class="section">
        <span class="label">Screen fitting</span>
        <div class="segment" id="modeSegment">
          <button type="button" data-mode="cover" class="active">Crop</button>
          <button type="button" data-mode="stretch">Stretch</button>
        </div>
      </section>

      <p class="hint">In Crop mode, drag the image to reposition it inside the screen.</p>

      <button class="download" id="downloadButton" type="button" disabled>Download mockup</button>
    </aside>

    <section class="workspace">
      <div class="stage" id="stage">
        <div class="canvas-wrap">
          <canvas id="preview"></canvas>
        </div>
        <div class="empty" id="emptyState">
          <strong>Upload a screenshot</strong>
          <span>It will appear inside the device screen</span>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // Add new devices and colors in this object.
    const DEVICES = [
      {
        id: 'iphone-17-pro-max',
        name: 'iPhone 17 Pro Max',
        width: 938,
        height: 1916,
        bodyRadius: 142,
        frameType: 'image',
        screen: { x: 46, y: 39, width: 846, height: 1838, radius: 102 },
        colors: [
          { id: 'cosmic-orange', name: 'Cosmic Orange', value: '#C86E3E', edge: '#C86E3E', asset: 'phones/iphone-17-pro-max__orange.png' },
          { id: 'deep-blue', name: 'Deep Blue', value: '#314657', edge: '#314657', asset: 'phones/iphone-17-pro-max__dark-blue.png' },
          { id: 'silver', name: 'Silver', value: '#C9C8C4', edge: '#C9C8C4', asset: 'phones/iphone-17-pro-max__silver.png' }
        ]
      },
      {
        id: 'google-pixel-11-pro',
        name: 'Google Pixel 11 Pro',
        width: 946,
        height: 1974,
        bodyRadius: 142,
        frameType: 'image',
        screen: { x: 39, y: 39, width: 854, height: 1897, radius: 115 },
        colors: [
          { id: 'canyon', name: 'Canyon', value: '#F69E8C', edge: '#F69E8C', asset: 'phones/Google-Pixel-11-Pro__Canyon.png' },
          { id: 'olive', name: 'Olive', value: '#9A9E85', edge: '#9A9E85', asset: 'phones/Google-Pixel-11-Pro__Olive.png' },
          { id: 'fog', name: 'Fog', value: '#D9E3DC', edge: '#D9E3DC', asset: 'phones/Google-Pixel-11-Pro__Fog.png' },
          { id: 'obsidian', name: 'Obsidian', value: '#424745', edge: '#424745', asset: 'phones/Google-Pixel-11-Pro__Obsidian.png' }
        ]
      }
    ];

    const $ = id => document.getElementById(id);
    const preview = $('preview');
    const ctx = preview.getContext('2d');
    const state = {
      deviceIndex: Math.max(0, DEVICES.findIndex(d => d.id === localStorage.getItem('mockup-device'))),
      colorIndex: 0,
      image: null,
      fileName: '',
      mode: 'cover',
      offsetX: 0,
      offsetY: 0,
      dragging: false,
      pointerX: 0,
      pointerY: 0
    };

    function device() { return DEVICES[state.deviceIndex]; }
    function color() { return device().colors[state.colorIndex] || device().colors[0]; }

    function roundedRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.moveTo(x + r, y);
      context.arcTo(x + width, y, x + width, y + height, r);
      context.arcTo(x + width, y + height, x, y + height, r);
      context.arcTo(x, y + height, x, y, r);
      context.arcTo(x, y, x + width, y, r);
      context.closePath();
    }

    function imageMetrics(d) {
      if (!state.image) return null;
      const s = d.screen;
      if (state.mode === 'stretch') {
        return { x: s.x, y: s.y, width: s.width, height: s.height };
      }
      const scale = Math.max(s.width / state.image.naturalWidth, s.height / state.image.naturalHeight);
      const width = state.image.naturalWidth * scale;
      const height = state.image.naturalHeight * scale;
      const maxX = Math.max(0, (width - s.width) / 2);
      const maxY = Math.max(0, (height - s.height) / 2);
      state.offsetX = Math.max(-maxX, Math.min(maxX, state.offsetX));
      state.offsetY = Math.max(-maxY, Math.min(maxY, state.offsetY));
      return {
        x: s.x + (s.width - width) / 2 + state.offsetX,
        y: s.y + (s.height - height) / 2 + state.offsetY,
        width,
        height
      };
    }

    function drawDevice(context, d, scale = 1, exportFrameImage = null) {
      context.save();
      context.scale(scale, scale);
      context.clearRect(0, 0, d.width, d.height);

      const s = d.screen;
      context.save();
      context.beginPath();
      roundedRect(context, s.x, s.y, s.width, s.height, s.radius);
      context.clip();
      context.fillStyle = '#0a0a0a';
      context.fillRect(s.x, s.y, s.width, s.height);
      if (state.image) {
        const m = imageMetrics(d);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        context.drawImage(state.image, m.x, m.y, m.width, m.height);
      }
      context.restore();

      const c = color();
      const frameImage = exportFrameImage || c.frameImage;
      if (d.frameType === 'image') {
        if (frameImage?.complete && frameImage.naturalWidth) {
          context.drawImage(frameImage, 0, 0, d.width, d.height);
        }
        context.restore();
        return;
      }

      const bodyGradient = context.createLinearGradient(0, 0, d.width, d.height);
      bodyGradient.addColorStop(0, c.edge);
      bodyGradient.addColorStop(.18, c.value);
      bodyGradient.addColorStop(.72, c.value);
      bodyGradient.addColorStop(1, c.edge);

      context.beginPath();
      roundedRect(context, 5, 5, d.width - 10, d.height - 10, d.bodyRadius);
      roundedRect(context, s.x, s.y, s.width, s.height, s.radius);
      context.fillStyle = bodyGradient;
      context.fill('evenodd');

      context.beginPath();
      roundedRect(context, 5, 5, d.width - 10, d.height - 10, d.bodyRadius);
      context.strokeStyle = 'rgba(255,255,255,.42)';
      context.lineWidth = 5;
      context.stroke();

      context.beginPath();
      roundedRect(context, s.x, s.y, s.width, s.height, s.radius);
      context.strokeStyle = 'rgba(0,0,0,.82)';
      context.lineWidth = 9;
      context.stroke();

      drawButtons(context, d, c);
      drawCutout(context, d);
      context.restore();
    }

    function drawButtons(context, d, c) {
      context.fillStyle = c.edge;
      const buttonW = Math.max(7, Math.round(d.width * .012));
      const leftX = 3;
      const rightX = d.width - buttonW - 3;
      const radius = buttonW / 2;
      const buttons = d.id.startsWith('iphone')
        ? [[leftX, 330, buttonW, 120], [leftX, 505, buttonW, 220], [rightX, 430, buttonW, 290]]
        : [[rightX, 350, buttonW, 190], [rightX, 590, buttonW, 280]];
      buttons.forEach(([x, y, w, h]) => {
        context.beginPath();
        roundedRect(context, x, y, w, h, radius);
        context.fill();
      });
    }

    function drawCutout(context, d) {
      const cutout = d.cutout;
      if (!cutout) return;
      if (cutout.type === 'island') {
        context.beginPath();
        roundedRect(context, cutout.x, cutout.y, cutout.width, cutout.height, cutout.radius);
        context.fillStyle = '#050505';
        context.fill();
        context.beginPath();
        context.arc(cutout.x + cutout.width - 38, cutout.y + cutout.height / 2, 13, 0, Math.PI * 2);
        context.fillStyle = '#111924';
        context.fill();
      } else {
        context.beginPath();
        context.arc(cutout.x, cutout.y, cutout.radius, 0, Math.PI * 2);
        context.fillStyle = '#080808';
        context.fill();
        context.beginPath();
        context.arc(cutout.x, cutout.y, cutout.radius * .45, 0, Math.PI * 2);
        context.fillStyle = '#182232';
        context.fill();
      }
    }

    function render() {
      const d = device();
      if (preview.width !== d.width || preview.height !== d.height) {
        preview.width = d.width;
        preview.height = d.height;
      }
      drawDevice(ctx, d);
      preview.classList.toggle('can-move', Boolean(state.image && state.mode === 'cover'));
      $('emptyState').classList.toggle('hidden', Boolean(state.image));
      const frameReady = device().frameType !== 'image' || Boolean(color().frameImage?.complete && color().frameImage.naturalWidth);
      $('downloadButton').disabled = !state.image || !frameReady;
    }

    function buildDeviceSelect() {
      $('deviceSelect').innerHTML = DEVICES.map((d, index) =>
        `<option value="${index}">${d.name}</option>`
      ).join('');
      $('deviceSelect').value = String(state.deviceIndex);
    }

    function buildSwatches() {
      $('swatches').innerHTML = device().colors.map((c, index) =>
        `<button class="swatch${index === state.colorIndex ? ' active' : ''}" style="--color:${c.value}" data-index="${index}" type="button" title="${c.name}" aria-label="${c.name}"></button>`
      ).join('');
    }

    function resetPosition() {
      state.offsetX = 0;
      state.offsetY = 0;
      render();
    }

    function loadFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('Choose a PNG, JPG, or WebP file');
        return;
      }
      const objectUrl = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        URL.revokeObjectURL(objectUrl);
        state.image = image;
        state.fileName = file.name;
        $('uploadLabel').textContent = 'Replace image';
        resetPosition();
      };
      image.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        showToast('Could not open the image');
      };
      image.src = objectUrl;
    }

    function downloadPng() {
      if (!state.image) return;
      const d = device();
      const frameImage = color().frameImage;
      if (d.frameType === 'image' && location.protocol === 'file:') {
        showToast('Open this page through a local server to download');
        return;
      }
      if (d.frameType === 'image' && (!frameImage || !frameImage.complete || !frameImage.naturalWidth)) return;
      const output = document.createElement('canvas');
      output.width = d.width;
      output.height = d.height;
      const outputContext = output.getContext('2d');
      drawDevice(outputContext, d, 1, frameImage);
      try {
        output.toBlob(blob => {
          if (!blob) {
            showToast('Could not create the mockup');
            return;
          }
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          const colorName = {
            'cosmic-orange': 'orange',
            'deep-blue': 'blue',
            silver: 'silver'
          }[color().id] || color().id;
          link.href = url;
          link.download = `iphone17-${colorName}.png`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('Mockup downloaded');
        }, 'image/png');
      } catch (error) {
        showToast('Download is unavailable for this local file');
      }
    }

    let toastTimer;
    function showToast(message) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    $('deviceSelect').addEventListener('change', event => {
      state.deviceIndex = Number(event.target.value);
      state.colorIndex = 0;
      localStorage.setItem('mockup-device', device().id);
      buildSwatches();
      resetPosition();
    });

    $('swatches').addEventListener('click', event => {
      const button = event.target.closest('.swatch');
      if (!button) return;
      state.colorIndex = Number(button.dataset.index);
      buildSwatches();
      render();
    });

    $('fileInput').addEventListener('change', event => loadFile(event.target.files[0]));

    $('modeSegment').addEventListener('click', event => {
      const button = event.target.closest('[data-mode]');
      if (!button) return;
      state.mode = button.dataset.mode;
      $('modeSegment').querySelectorAll('button').forEach(item => item.classList.toggle('active', item === button));
      resetPosition();
    });

    $('downloadButton').addEventListener('click', downloadPng);

    preview.addEventListener('pointerdown', event => {
      if (!state.image || state.mode !== 'cover') return;
      state.dragging = true;
      state.pointerX = event.clientX;
      state.pointerY = event.clientY;
      preview.setPointerCapture(event.pointerId);
    });

    preview.addEventListener('pointermove', event => {
      if (!state.dragging) return;
      const rect = preview.getBoundingClientRect();
      const d = device();
      state.offsetX += (event.clientX - state.pointerX) * d.width / rect.width;
      state.offsetY += (event.clientY - state.pointerY) * d.height / rect.height;
      state.pointerX = event.clientX;
      state.pointerY = event.clientY;
      render();
    });

    function stopDragging() { state.dragging = false; }
    preview.addEventListener('pointerup', stopDragging);
    preview.addEventListener('pointercancel', stopDragging);

    const stage = $('stage');
    window.addEventListener('dragover', event => {
      event.preventDefault();
      stage.classList.add('dragover');
    });
    window.addEventListener('dragleave', event => {
      if (!event.relatedTarget) stage.classList.remove('dragover');
    });
    window.addEventListener('drop', event => {
      event.preventDefault();
      stage.classList.remove('dragover');
      loadFile(event.dataTransfer.files[0]);
    });

    window.addEventListener('keydown', event => {
      if (!state.image || state.mode !== 'cover' || !['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)) return;
      event.preventDefault();
      const step = event.shiftKey ? 30 : 8;
      if (event.key === 'ArrowUp') state.offsetY -= step;
      if (event.key === 'ArrowDown') state.offsetY += step;
      if (event.key === 'ArrowLeft') state.offsetX -= step;
      if (event.key === 'ArrowRight') state.offsetX += step;
      render();
    });

    DEVICES.forEach(item => item.colors.forEach(itemColor => {
      if (!itemColor.asset) return;
      itemColor.frameImage = new Image();
      itemColor.frameImage.addEventListener('load', render);
      itemColor.frameImage.addEventListener('error', () => {
        if (device() !== item || itemColor !== color()) return;
        state.deviceIndex = 0;
        state.colorIndex = 0;
        localStorage.setItem('mockup-device', device().id);
        buildDeviceSelect();
        buildSwatches();
        render();
        showToast('Frame image is unavailable');
      });
      itemColor.frameImage.src = itemColor.asset;
    }));

    buildDeviceSelect();
    buildSwatches();
    render();
  </script>
</body>
</html>
